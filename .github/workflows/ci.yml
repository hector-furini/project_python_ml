name: CI

on:
  push:
  pull_request:

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
          - "3.11"

    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    env:
      # Backend sem interface gráfica para matplotlib/seaborn
      MPLBACKEND: Agg
      # Streamlit em modo "bare" (sem servidor) durante os testes
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ./dev/docker/requirements.txt

      - name: Atualizar pip
        run: python -m pip install --upgrade pip

      - name: Install dependences
        run: python -m pip install -r ./dev/docker/requirements.txt

      - name: Check numpy / pyarrow compatibility
        run: |
          python -c "import numpy, pyarrow; print('numpy', numpy.__version__, '| pyarrow', pyarrow.__version__)"

# -------------------------------------------------------------------------------------------------------
# App Streamlit - Projeto Hector (dev/script/app_hector)
      - name: Run Pytest app_hector
        run: pytest ./dev/script/app_hector/py_test

      - name: Run Ruff app_hector
        run: ruff format ./dev/script/app_hector

      - name: Run Mypy app_hector
        run: mypy ./dev/script/app_hector --ignore-missing-imports --follow-imports skip

      - name: Run Flake app_hector
        run: flake8 --max-complexity 12 ./dev/script/app_hector

# -------------------------------------------------------------------------------------------------------
      - name: Run Pytest aula
        run: pytest ./dev/script/app_testes/py_test

      - name: Run Ruff aula
        run: ruff format ./dev/script/app_testes

      - name: Run Mypy aula
        run: mypy ./dev/script/app_testes --ignore-missing-imports --follow-imports skip

      - name: Run Flake aula
        run: flake8 --max-complexity 12 ./dev/script/app_testes

# -------------------------------------------------------------------------------------------------------
      - name: Run Pytest pratica
        run: pytest ./dev/script/app_pratica/py_test

      - name: Run Ruff pratica
        run: ruff format ./dev/script/app_pratica

      - name: Run Mypy pratica
        run: mypy ./dev/script/app_pratica --ignore-missing-imports --follow-imports skip

      - name: Run Flake pratica
        run: flake8 --max-complexity 12 ./dev/script/app_pratica
